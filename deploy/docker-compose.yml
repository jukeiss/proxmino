# Proxmino on a home server (Ubuntu Server + CasaOS, ThinkPad T480 class: 4 cores, 8-16 GB RAM, no GPU).
#   cd proxmino && docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec ollama ollama pull phi4-mini
#   docker compose -f deploy/docker-compose.yml exec proxmino python -m proxmino password
# Then open http://<server LAN address>:3000 from another device and sign in.
name: proxmino
services:
  ollama:
    image: ollama/ollama   # pin a version you have tested, for example ollama/ollama:<version>
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m         # keep the model loaded 10 minutes after the last answer
      OLLAMA_MAX_LOADED_MODELS: "1"  # 8 GB RAM: one model at a time
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"      # faster attention
      OLLAMA_KV_CACHE_TYPE: q8_0       # conversation memory at 8 bits: about half the RAM
    volumes:
      - ollama:/root/.ollama
    # no ports: only the app can reach the model server
  searxng:
    image: searxng/searxng   # web search for the app, no API key needed
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-please}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m
    # no ports: only the app can reach it
  proxmino:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on: [ollama, searxng]
    environment:
      OLLAMA_URL: http://ollama:11434
      PROXMINO_SEARXNG_URL: http://searxng:8080
      PROXMINO_HOSTS: ${PROXMINO_HOSTS:-}   # the server's LAN address or name, for example 192.168.1.50,thinkpad.local
      PROXMINO_ENV_FILE: /data/.env        # keys live in the data volume, so updates keep them
      PROXMINO_REMOTE_KEYS: "1"            # Settings > API keys works from your phone or Mac after you sign in
    volumes:
      - data:/data
      - bots:/home/proxmino/.proxmino
    ports:
      - "3000:3000"
    mem_limit: 768m
volumes:
  ollama:
  data:
  bots:
x-casaos:
  architectures: [amd64]
  main: proxmino
  author: Proxmino
  category: Chat
  title:
    en_us: Proxmino
  tagline:
    en_us: Your own AI assistant with bots, groups and a reply desk
  port_map: "3000"
